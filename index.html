<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zida Bruun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F3EDE1;
    --cream-soft:#FBF8F2;
    --ink:#2E2A22;
    --ink-soft:#665f4d;
    --clay:#A85D3B;
    --clay-dark:#8B4A2E;
    --gold:#C89B3C;
    --olive:#566246;
    --border:#DDD3BF;
    --shadow: 0 1px 2px rgba(46,42,34,0.06), 0 8px 24px rgba(46,42,34,0.06);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; background:var(--cream); color:var(--ink);
    font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Fraunces', serif; margin:0; font-weight:500;}
  a{color:inherit;}
  img{max-width:100%; display:block;}

  header{
    position:sticky; top:0; z-index:50;
    background:rgba(243,237,225,0.9); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
  }
  .nav-inner{
    max-width:1100px; margin:0 auto; padding:16px 24px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{font-family:'Fraunces', serif; font-size:1.15rem; letter-spacing:0.02em;}
  nav a{
    text-decoration:none; font-size:0.85rem; letter-spacing:0.08em;
    text-transform:uppercase; margin-left:28px; color:var(--ink-soft);
    transition:color .2s;
  }
  nav a:hover{color:var(--clay);}

  .hero{ max-width:1100px; margin:0 auto; padding:110px 24px 90px; text-align:center; }
  .hero .eyebrow{
    display:inline-block; font-size:0.75rem; letter-spacing:0.22em;
    text-transform:uppercase; color:var(--clay); margin-bottom:22px;
    border:1px solid var(--clay); padding:6px 14px; border-radius:2px;
  }
  .hero h1{ font-size:clamp(2.6rem, 7vw, 4.6rem); line-height:1.05; color:var(--ink); }
  .hero .tagline{
    font-family:'Fraunces', serif; font-style:italic; font-size:1.25rem;
    color:var(--ink-soft); margin-top:22px; max-width:560px; margin-left:auto; margin-right:auto;
  }
  .hero .rule{ width:60px; height:2px; background:var(--gold); margin:36px auto 0; }

  section{max-width:1100px; margin:0 auto; padding:60px 24px;}
  .section-head{margin-bottom:44px; text-align:center;}
  .section-head .label{
    font-size:0.75rem; letter-spacing:0.22em; text-transform:uppercase;
    color:var(--olive); display:block; margin-bottom:10px;
  }
  .section-head h2{font-size:2.1rem;}

  .gallery-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:40px; }
  .art-card{
    background:var(--cream-soft); border:1px solid var(--border);
    border-radius:3px; overflow:hidden; box-shadow:var(--shadow);
    display:flex; flex-direction:column;
  }
  .art-image-wrap{ aspect-ratio:4/5; overflow:hidden; background:var(--border); }
  .art-image-wrap img{width:100%; height:100%; object-fit:cover;}
  .art-plaque{padding:20px 22px 24px; border-top:1px solid var(--border);}
  .plaque-index{
    font-size:0.7rem; letter-spacing:0.15em; color:var(--ink-soft); text-transform:uppercase;
  }
  .plaque-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-top:6px;}
  .plaque-top h3{font-size:1.2rem; line-height:1.3;}
  .tag{
    font-size:0.65rem; letter-spacing:0.1em; text-transform:uppercase;
    padding:4px 9px; border-radius:20px; white-space:nowrap; margin-top:4px;
  }
  .tag.available{background:rgba(86,98,70,0.12); color:var(--olive);}
  .tag.sold{background:rgba(168,93,59,0.12); color:var(--clay-dark);}
  .art-plaque .medium{ font-style:italic; color:var(--ink-soft); font-size:0.88rem; margin:8px 0 0; }
  .art-plaque .desc{ font-size:0.9rem; color:var(--ink-soft); margin:10px 0 0; line-height:1.55; }
  .art-plaque .price{
    font-family:'Fraunces', serif; font-size:1.15rem; color:var(--clay-dark);
    margin:14px 0 0; font-weight:500;
  }
  .empty-state{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
    border:1px dashed var(--border); border-radius:4px;
  }

  /* About / CV */
  .about-top{ display:grid; grid-template-columns:1fr 1.4fr; gap:56px; align-items:center; margin-bottom:56px; }
  .about-portrait{ aspect-ratio:1; border-radius:3px; overflow:hidden; background:var(--border); box-shadow:var(--shadow); }
  .about-portrait img{width:100%; height:100%; object-fit:cover;}
  .about-text p{color:var(--ink-soft); line-height:1.75; font-size:1.02rem;}
  @media (max-width:720px){ .about-top{grid-template-columns:1fr;} }

  .cv-columns{ display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:48px; }
  .cv-block h3{
    font-size:0.85rem; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--clay-dark); margin-bottom:20px; padding-bottom:10px;
    border-bottom:1px solid var(--border);
  }
  .cv-entry{ display:flex; gap:16px; margin-bottom:14px; align-items:baseline; }
  .cv-entry .yr{
    font-family:'Fraunces', serif; font-style:italic; color:var(--olive);
    font-size:0.92rem; flex-shrink:0; width:44px;
  }
  .cv-entry .dt{ font-size:0.92rem; color:var(--ink-soft); line-height:1.5; }

  footer{ background:var(--ink); color:var(--cream); margin-top:40px; }
  .contact-inner{ max-width:1100px; margin:0 auto; padding:70px 24px 40px; text-align:center; }
  .contact-inner .label{
    font-size:0.75rem; letter-spacing:0.22em; text-transform:uppercase;
    color:var(--gold); display:block; margin-bottom:14px;
  }
  .contact-inner h2{color:var(--cream); font-size:2rem; margin-bottom:28px;}
  .contact-links{ display:flex; flex-wrap:wrap; justify-content:center; gap:14px; margin-bottom:10px; }
  .contact-links a{
    text-decoration:none; border:1px solid rgba(243,237,225,0.3); padding:11px 22px;
    border-radius:30px; font-size:0.9rem; transition:all .2s;
  }
  .contact-links a:hover{background:var(--clay); border-color:var(--clay);}
  .footer-bottom{
    text-align:center; padding:22px 24px; font-size:0.75rem; color:rgba(243,237,225,0.5);
    border-top:1px solid rgba(243,237,225,0.12);
  }
  .footer-bottom a{ color:rgba(243,237,225,0.5); text-decoration:underline; }
</style>
</head>
<body>

<header>
  <div class="nav-inner">
    <div class="brand" id="nav-brand">Zida Bruun</div>
    <nav>
      <a href="#gallery">Gallery</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
</header>

<section class="hero">
  <span class="eyebrow">Original Works</span>
  <h1 id="hero-name">Zida Bruun</h1>
  <p class="tagline" id="hero-tagline">Loading…</p>
  <div class="rule"></div>
</section>

<section id="gallery">
  <div class="section-head">
    <span class="label">Available Works</span>
    <h2>Gallery</h2>
  </div>
  <div id="gallery-grid" class="gallery-grid"></div>
</section>

<section id="about">
  <div class="about-top">
    <div class="about-portrait"><img id="about-image" src="" alt="Portrait" style="display:none;"></div>
    <div class="about-text">
      <span class="label" style="color:var(--olive); font-size:0.75rem; letter-spacing:0.22em; text-transform:uppercase; display:block; margin-bottom:14px;">About the Artist</span>
      <p id="about-bio"></p>
    </div>
  </div>
  <div class="cv-columns">
    <div class="cv-block">
      <h3>Education</h3>
      <div id="cv-education"></div>
    </div>
    <div class="cv-block">
      <h3>Selected Exhibitions</h3>
      <div id="cv-exhibitions"></div>
    </div>
    <div class="cv-block" id="cv-bibliography-block">
      <h3>Bibliography</h3>
      <div id="cv-bibliography"></div>
    </div>
  </div>
</section>

<footer id="contact">
  <div class="contact-inner">
    <span class="label">Get in Touch</span>
    <h2>Contact</h2>
    <div class="contact-links" id="contact-links"></div>
  </div>
  <div class="footer-bottom">
    <span id="footer-name">Zida Bruun</span> &nbsp;·&nbsp;
    <a href="/admin/">Site owner? Edit this site</a>
  </div>
</footer>

<!-- Handles the invite-link redirect from Netlify Identity emails -->
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", user => {
      if (!user) {
        window.netlifyIdentity.on("login", () => { document.location.href = "/admin/"; });
      }
    });
  }
</script>

<script>
function formatPrice(n){
  const num = Number(n) || 0;
  return num.toLocaleString('nb-NO') + ' kr';
}
function escapeHtml(str){
  if(!str) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadSite(){
  let settings = {};
  let artworksData = { items: [] };
  try{
    const [sRes, aRes] = await Promise.all([
      fetch('/content/settings.json').then(r => r.json()),
      fetch('/content/artworks.json').then(r => r.json())
    ]);
    settings = sRes;
    artworksData = aRes;
  }catch(e){
    document.getElementById('hero-tagline').textContent = 'Content could not be loaded.';
    return;
  }
  render(settings, artworksData.items || []);
}

function render(s, artworks){
  document.getElementById('nav-brand').textContent = s.artistName || 'Artist';
  document.getElementById('hero-name').textContent = s.artistName || 'Artist';
  document.getElementById('hero-tagline').textContent = s.tagline || '';
  document.getElementById('footer-name').textContent = s.artistName || 'Artist';
  document.getElementById('about-bio').textContent = s.bio || '';

  const aboutImg = document.getElementById('about-image');
  if(s.portrait){ aboutImg.src = s.portrait; aboutImg.style.display='block'; }

  const links = document.getElementById('contact-links');
  links.innerHTML = '';
  if(s.email) links.innerHTML += `<a href="mailto:${escapeHtml(s.email)}">Email</a>`;
  if(s.phone) links.innerHTML += `<a href="tel:${escapeHtml(s.phone)}">${escapeHtml(s.phone)}</a>`;
  if(s.instagram) links.innerHTML += `<a href="${escapeHtml(s.instagram)}" target="_blank" rel="noopener">Instagram</a>`;
  if(s.facebook) links.innerHTML += `<a href="${escapeHtml(s.facebook)}" target="_blank" rel="noopener">Facebook</a>`;
  if(s.otherLink) links.innerHTML += `<a href="${escapeHtml(s.otherLink)}" target="_blank" rel="noopener">${escapeHtml(s.otherLinkLabel || 'More')}</a>`;
  if(!links.innerHTML) links.innerHTML = `<span style="color:rgba(243,237,225,0.5); font-size:0.9rem;">Contact details coming soon.</span>`;

  const cvList = (id, entries) => {
    const el = document.getElementById(id);
    if(!entries || entries.length === 0){ el.innerHTML = ''; return; }
    el.innerHTML = entries.map(e => `
      <div class="cv-entry"><span class="yr">${escapeHtml(e.year)}</span><span class="dt">${escapeHtml(e.detail)}</span></div>
    `).join('');
  };
  cvList('cv-education', s.education);
  cvList('cv-exhibitions', s.exhibitions);
  cvList('cv-bibliography', s.bibliography);
  if(!s.bibliography || s.bibliography.length === 0){
    document.getElementById('cv-bibliography-block').style.display = 'none';
  }

  const grid = document.getElementById('gallery-grid');
  if(!artworks || artworks.length === 0){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">No artworks added yet. Check back soon.</div>`;
  } else {
    grid.innerHTML = artworks.map((a, i) => `
      <div class="art-card">
        <div class="art-image-wrap">${a.image ? `<img src="${a.image}" alt="${escapeHtml(a.title)}" loading="lazy">` : ''}</div>
        <div class="art-plaque">
          <span class="plaque-index">No. ${String(i+1).padStart(2,'0')}</span>
          <div class="plaque-top">
            <h3>${escapeHtml(a.title || 'Untitled')}</h3>
            <span class="tag ${a.sold ? 'sold' : 'available'}">${a.sold ? 'Sold' : 'Available'}</span>
          </div>
          ${a.medium ? `<p class="medium">${escapeHtml(a.medium)}</p>` : ''}
          ${a.description ? `<p class="desc">${escapeHtml(a.description)}</p>` : ''}
          <p class="price">${formatPrice(a.price)}</p>
        </div>
      </div>
    `).join('');
  }
}

loadSite();
</script>
</body>
</html>
