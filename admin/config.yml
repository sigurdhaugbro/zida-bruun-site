# Use DecapBridge classic auth (required)
backend:
  name: git-gateway
  repo: sigurdhaugbro/zida-bruun-site
  branch: main
  identity_url: https://auth.decapbridge.com/sites/6627f945-0308-4a5f-8abe-235dd4d8018e
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge
logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://zidabruun.netlify.app

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - file: "content/settings.json"
        label: "Site Settings"
        name: "settings"
        fields:
          - { label: "Artist Name", name: "artistName", widget: "string" }
          - { label: "Front Page Image", name: "frontImage", widget: "image", required: false, hint: "Shown alone on the yellow homepage. If left empty, the most recent exhibition's photo is used instead." }
          - { label: "Bio", name: "bio", widget: "text" }
          - { label: "About", name: "aboutText", widget: "text", required: false, hint: "Shown between Bio and Education on the About page." }
          - label: "Education"
            name: "education"
            widget: "list"
            summary: "{{fields.year}} — {{fields.detail}}"
            fields:
              - { label: "Year", name: "year", widget: "string" }
              - { label: "Detail", name: "detail", widget: "string" }
          - label: "Exhibitions and Activities"
            name: "exhibitionsActivities"
            widget: "list"
            summary: "{{fields.year}} — {{fields.detail}}"
            fields:
              - { label: "Year", name: "year", widget: "string" }
              - { label: "Detail", name: "detail", widget: "string" }

  - name: "artworks"
    label: "Selected Works"
    files:
      - file: "content/artworks.json"
        label: "Selected Works"
        name: "artworks"
        fields:
          - label: "Works"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Year", name: "year", widget: "string" }
              - { label: "Medium / Dimensions", name: "medium", widget: "string" }
              - label: "Images"
                name: "images"
                widget: "list"
                field: { label: "Image", name: "image", widget: "image" }

  - name: "exhibitions"
    label: "Exhibitions"
    files:
      - file: "content/exhibitions.json"
        label: "Exhibitions"
        name: "exhibitions"
        fields:
          - label: "Exhibitions"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Exhibition Title", name: "title", widget: "string", hint: "Shown in the Exhibitions overview list, e.g. the group show's name." }
              - { label: "Work Title", name: "workTitle", widget: "string", required: false, hint: "Shown on the individual page when you click in — the title of the piece you made for this show. If left empty, Exhibition Title is used instead." }
              - { label: "Venue", name: "venue", widget: "string" }
              - { label: "Year", name: "year", widget: "string" }
              - { label: "Material", name: "medium", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Image", name: "image", widget: "image", required: false }
